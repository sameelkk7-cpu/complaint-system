<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="TR7neylDhE_WZOVUF7xNpwSIpIuF2txifoDV4UKWaKw" />
<title>Sign in — Residents' Complaint Desk</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="panel">
    <div class="brand-mark">
      <strong>Residents' Complaint Desk</strong>
      <span>Noise &amp; nuisance reporting for your society</span>
    </div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" style="width:100%; margin-top:18px;">Sign in</button>
      <p class="error-msg" id="errorMsg" style="display:none;"></p>
    </form>
    <div class="switch-link">New here? <a href="register.html">Register an account</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // If already logged in, skip straight to the right dashboard.
  const existing = getUser();
  if (existing && getToken()) window.location.href = `${existing.role}-dashboard.html`;

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';
    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        }
      });
      saveSession(data.token, data.user);
      window.location.href = `${data.user.role}-dashboard.html`;
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = 'block';
    }
  });
</script>
</body>
</html>
